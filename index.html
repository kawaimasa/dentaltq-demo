function PatientDetail({ patient, visit }) {
  const settings = useDoc('settings', 'clinic') || {};
  const [callOpen, setCallOpen] = useState(false);
  const confirmed = sortAlerts(patient.alerts);
  const sugg = visit ? suggestAlerts(visit, patient).filter(a => !confirmed.some(x => x.id === a.id)) : [];
  const toAlert = a => ({ id: a.id, label: a.label, level: a.level, note: a.note || '', at: Date.now() });
  const addAlert = a => Store.update('patients', patient.id, { alerts: [...(patient.alerts || []), toAlert(a)] });
  const addAll = () => Store.update('patients', patient.id, { alerts: [...(patient.alerts || []), ...sugg.map(toAlert)] });
  const removeAlert = a => Store.update('patients', patient.id, { alerts: (patient.alerts || []).filter(x => x.id !== a.id) });
  const age = U.age(patient.birth);
  return html`<div>
    <div className="pd-head">
      <${Avatar} patient=${patient} size="lg" />
      <div className="pd-who">
        <p className="pd-name">${U.displayName(patient)}</p>
        <p className="meta">${patient.kanji ? patient.kana + '　' : ''}${age != null ? age + '歳' : ''}${SEX[patient.sex] ? '・' + SEX[patient.sex] : ''}　No.${patient.no}${patient.tel ? '　' + U.telText(patient.tel) : ''}</p>
      </div>
      ${visit ? html`<div className="pd-actions">
        <${StatusPill} status=${visit.status} />
        ${visit.status === 'answered' ? html`<button type="button" className="btn primary small" onClick=${() => Ops.setStatus(visit, 'in_treatment')}>診察を始める</button>` : null}
        ${visit.status === 'in_treatment' ? html`<button type="button" className="btn primary small" onClick=${() => Ops.setStatus(visit, 'treated')}>診察を終える</button>` : null}
        ${visit.status !== 'done' ? html`<button type="button" className="btn small" onClick=${() => setCallOpen(true)}>呼ぶ</button>` : null}
      </div>` : null}
    </div>

    <section className="pd-sec">
      <div className="sec-h"><h2>要注意事項</h2><p className="meta">問診の回答から候補を出し、確かめたものだけを残します。</p></div>
      <div className="flags">${confirmed.length ? confirmed.map(a => html`<${Flag} key=${a.id} a=${a} onRemove=${() => removeAlert(a)} />`) : html`<span className="meta">登録されていません。</span>`}</div>
      ${sugg.length ? html`<div className="suggest-box">
        <p className="meta">今回の問診から見つかった候補</p>
        <div className="flags">${sugg.map(a => html`<${Flag} key=${a.id} a=${a} suggest=${true} onAdd=${() => addAlert(a)} />`)}</div>
        ${sugg.length > 1 ? html`<button type="button" className="btn small" onClick=${addAll}>候補をすべて追加</button>` : null}
      </div>` : null}
    </section>

    ${visit ? html`<${AnswerSheet} visit=${visit} patient=${patient} />` : null}
    <${StaffNote} patient=${patient} />
    <${PostComposer} patient=${patient} visit=${visit} settings=${settings} />
    <${PostList} patient=${patient} />
    <${MessageThread} patient=${patient} as="staff" />
    <${VisitHistory} patient=${patient} />
    ${callOpen && visit ? html`<${CallModal} v=${visit} onClose=${() => setCallOpen(false)} />` : null}
  </div>`;
}

  </section>`;

function Recall({ settings }) {
  const patients = useColl('patients');
  const visits = useColl('visits');
  const notices = useColl('notices');
  const [months, setMonths] = useState('6');
  const [off, setOff] = useState({});
  const [text, setText] = useState(DEFAULT_RECALL);
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const clinic = (settings && settings.name) || '';
  const activeIds = new Set(visits.filter(v => v.status !== 'done').map(v => v.patientId));
  const cutoff = Date.now() - Number(months) * 30 * 86400000;
  const cands = patients.filter(p => !p.provisional && p.lastVisitAt && p.lastVisitAt < cutoff && !activeIds.has(p.id)).sort((a, b) => a.lastVisitAt - b.lastVisitAt);
  const channel = p => (p.consent && p.email ? 'メール' : p.consent && p.tel ? 'SMS' : 'はがき');
  const fill = p => text.replace(/\{name\}/g, U.displayName(p)).replace(/\{months\}/g, String(Math.max(1, Math.floor((Date.now() - p.lastVisitAt) / (30 * 86400000))))).replace(/\{clinic\}/g, clinic);
  const chosen = cands.filter(p => !off[p.id]);
  async function send() {
    setBusy(true);
    let n = 0;
    for (const p of chosen) {
      const ok = await Store.set('notices', U.uid('n'), { patientId: p.id, kind: 'recall', title: '定期検診のご案内', channel: channel(p), text: fill(p), at: Date.now() });
      if (ok) n++;
    }
    setBusy(false);
    setMsg(n + '人に送りました。デモでは各患者さんのマイページの「お知らせ」に届きます。');
  }
  const sent = [...notices].sort((a, b) => b.at - a.at).slice(0, 8);
  return html`<section className="pd-sec">
    <div className="sec-h"><h2>定期検診のお知らせ（リコール）</h2><p className="meta">前回の来院から間があいた方を抜き出して、まとめてお知らせします。</p></div>
    <div className="row gap wrap">
      <label className="field inline"><span>前回の来院から</span>
        <select value=${months} onChange=${e => { setMonths(e.target.value); setMsg(''); }}>
          <option value="3">3か月以上</option><option value="6">6か月以上</option><option value="12">12か月以上</option>
        </select></label>
      <span className="meta">${cands.length}人が対象です。</span>
    </div>
    ${cands.length ? html`<div className="scroll-x"><table className="ledger compact">
      <thead><tr><th><span className="visually-hidden">送る</span></th><th>患者さん</th><th>最終来院</th><th>送り方</th></tr></thead>
      <tbody>${cands.map(p => html`<tr key=${p.id}>
        <td><input type="checkbox" aria-label=${U.displayName(p) + 'に送る'} checked=${!off[p.id]} onChange=${e => setOff({ ...off, [p.id]: !e.target.checked })} /></td>
        <td>${U.displayName(p)}<span className="meta">　No.${p.no}</span></td>
        <td>${U.date(p.lastVisitAt)}<span className="meta">（${U.ago(p.lastVisitAt)}）</span></td>
        <td>${channel(p)}${channel(p) === 'はがき' ? html`<span className="meta">（受け取りの同意なし）</span>` : null}</td>
      </tr>`)}</tbody></table></div>` : html`<p className="meta">対象の方はいません。</p>`}
    <label className="field"><span>文面（{name}・{months}・{clinic} は自動で置き換わります）</span><textarea rows="4" value=${text} onChange=${e => setText(e.target.value)}></textarea></label>
    <div className="row gap wrap"><button type="button" className="btn primary" disabled=${busy || !chosen.length} onClick=${send}>${chosen.length}人にお知らせを送る（デモ）</button><span className="meta" aria-live="polite">${msg}</span></div>
    <p className="meta">本番ではSMS・メールの配信サービスにつなぎ、はがきは宛名データ（CSV）を出力して宛名ソフトや印刷サービスに渡します。</p>
    ${sent.length ? html`<details className="sent"><summary>送ったお知らせ（${notices.length}件）</summary>
      <ul>${sent.map(n => { const p = Store.get('patients', n.patientId); return html`<li key=${n.id}>${U.dateShort(n.at)} ${U.time(n.at)}　${U.displayName(p)}・${n.channel}</li>`; })}</ul>
    </details>` : null}
  </section>`;
}

function Bars({ rows, unit }) {
  const max = Math.max(1, ...rows.map(r => r.n));
  return html`<ul className="bars">${rows.map(r => html`<li key=${r.label}>
    <span className="bl">${r.label}</span><span className="bar"><i style=${{ width: (r.n / max * 100) + '%' }}></i></span><span className="bn">${r.n}${unit || ''}</span>
  </li>`)}</ul>`;
}

function Stats() {
  const patients = useColl('patients');
  const visits = useColl('visits');
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const monthVisits = visits.filter(v => v.createdAt >= monthStart);
  const views = visits.map(v => answeredView(v, Store.get('patients', v.patientId)));
  const tally = (qid, q) => {
    const m = {};
    for (const view of views) {
      const a = view.answers[qid];
      if (a == null) continue;
      for (const id of (Array.isArray(a) ? a : [a])) m[id] = (m[id] || 0) + 1;
    }
    return Object.entries(m).map(([id, n]) => ({ label: optLabel(q, id, 'ja'), n })).sort((a, b) => b.n - a.n);
  };
  const durs = visits.filter(v => v.startedAt && v.completedAt && v.completedAt > v.startedAt).map(v => (v.completedAt - v.startedAt) / 60000);
  const avg = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;
  const decades = {};
  for (const p of patients) { const a = U.age(p.birth); if (a == null) continue; const k = a < 20 ? '20歳未満' : a >= 70 ? '70歳以上' : Math.floor(a / 10) * 10 + '代'; decades[k] = (decades[k] || 0) + 1; }
  const order = ['20歳未満', '20代', '30代', '40代', '50代', '60代', '70歳以上'];
  return html`<section className="pd-sec">
    <div className="sec-h"><h2>数字で見る</h2><p className="meta">問診の回答がそのまま集計に使えます（デモデータでの例）。</p></div>
    <dl className="kpis">
      <div><dt>登録患者</dt><dd>${patients.filter(p => !p.provisional).length}<small>人</small></dd></div>
      <div><dt>今月の来院</dt><dd>${monthVisits.length}<small>件</small></dd></div>
      <div><dt>今月の新患</dt><dd>${monthVisits.filter(v => v.isNew).length}<small>人</small></dd></div>
      <div><dt>問診の回答時間（平均）</dt><dd>${avg != null ? avg : '—'}<small>分</small></dd></div>
    </dl>
    <div className="stat-grid">
      <div><h3>来院理由</h3>${tally('reasons', Q.reasons).length ? html`<${Bars} rows=${tally('reasons', Q.reasons)} unit="件" />` : html`<p className="meta">まだ回答がありません。</p>`}</div>
      <div><h3>当院を知ったきっかけ</h3>${tally('source', Q.source).length ? html`<${Bars} rows=${tally('source', Q.source)} unit="件" />` : html`<p className="meta">まだ回答がありません。</p>`}</div>
      <div><h3>患者さんの年代</h3><${Bars} rows=${order.filter(k => decades[k]).map(k => ({ label: k, n: decades[k] }))} unit="人" /></div>
    </div>
  </section>`;
}

function TemplateList() {
  const [open, setOpen] = useState('new');
  const tpl = templateOf(open);
  return html`<section className="pd-sec">
    <div className="sec-h"><h2>問診の内容</h2><p className="meta">設問と分岐の条件はデータとして持っています。医院ごとに変えられ、変えると版が上がり、過去の回答は答えたときの版で表示します。</p></div>
    <${Seg} label="問診の種類" value=${open} onChange=${setOpen} options=${Object.values(TEMPLATES).map(t => ({ id: t.id, label: t.name }))} />
    <ol className="tpl-list">
      ${tpl.questions.filter(q => q.type !== 'info' && q.type !== 'review').map(q => html`<li key=${q.id}>
        <span className="tq">${tr(q.title)}</span>
        <span className="meta">${TYPE_LABEL[q.type] || q.type}${q.required ? '・必須' : ''}${q.showIf ? '・表示するのは ' + describeCond(q.showIf) + ' とき' : ''}</span>
      </li>`)}
    </ol>
    <p className="meta">版 ${tpl.version}・日本語／英語</p>
  </section>`;
}

function DemoData() {
  useStoreVersion();
  const [confirm, setConfirm] = useState(false);
  const [msg, setMsg] = useState('');
  const m = Store.mode;
  const canReset = m === 'local' || (m === 'shared' && (Store.canEdit || Store.isOwner));
  const desc = m === 'shared' ? 'この画面を開いている端末どうしで、データがリアルタイムに同期しています。共有した相手にも同じデータが見えるので、実在の患者さんの情報は入れないでください。'
    : m === 'readonly' ? 'このアカウントは共有データを見ることだけができます。操作して試すときは「この端末だけで試す」に切り替えてください。'
    : 'この端末のブラウザの中だけにデータを保存しています。同じ端末の別のタブとは同期します。';
  const toLocal = () => { LS.set('dtq-mode', 'local'); location.reload(); };
  const toShared = () => { LS.del('dtq-mode'); location.reload(); };
  const reset = async () => { setConfirm(false); const ok = await Store.resetDemo(); setMsg(ok ? '初期状態に戻しました。受付時刻はいまの時刻に合わせて作り直しています。' : '戻せませんでした。'); };
  return html`<section className="pd-sec">
    <div className="sec-h"><h2>デモデータ</h2></div>
    <p>${desc}</p>
    <div className="row gap wrap">
      ${m !== 'local' ? html`<button type="button" className="btn" onClick=${toLocal}>この端末だけで試す</button>` : null}
      ${m === 'local' && window.claude && typeof window.claude.use === 'function' ? html`<button type="button" className="btn" onClick=${toShared}>共有データに戻す</button>` : null}
      ${canReset ? (confirm
        ? html`<span className="confirm">受付・回答・記事・連絡をすべて消して、最初の状態に戻します。<button type="button" className="btn danger small" onClick=${reset}>戻す</button><button type="button" className="btn ghost small" onClick=${() => setConfirm(false)}>やめる</button></span>`
        : html`<button type="button" className="btn" onClick=${() => { setConfirm(true); setMsg(''); }}>デモを初期状態に戻す</button>`) : null}
    </div>
    <p className="meta" aria-live="polite">${Store.busy || msg}</p>
  </section>`;
}

function AdminView() {
  const settings = useDoc('settings', 'clinic');
  return html`<div className="page">
    <header className="view-h"><div><h1>管理</h1><p className="sub">医院の情報、定期検診のお知らせ、数字のまとめ、問診の内容、デモデータ。</p></div></header>
    <${ClinicSettings} key=${settings ? settings.updatedAt : 'none'} settings=${settings} />
    <${Recall} settings=${settings} />
    <${Stats} />
    <${TemplateList} />
    <${DemoData} />
  </div>`;
}

/* ---------- 画面の枠組み ---------- */
const ROUTES = [['home', 'はじめに'], ['reception', '受付'], ['clinic', '診療室'], ['kiosk', '院内iPad'], ['phone', 'スマホで問診'], ['mypage', 'マイページ'], ['admin', '管理']];
const readRoute = () => { const h = (location.hash || '').replace(/^#/, ''); return ROUTES.some(r => r[0] === h) ? h : 'home'; };

function ModeBadge() {
  useStoreVersion();
  const m = Store.mode;
  const label = m === 'shared' ? '端末間で同期中' : m === 'readonly' ? '共有データ（閲覧のみ）' : m === 'local' ? 'この端末だけで動作中' : '接続中';
  return html`<span className=${'mode ' + m}>${label}</span>`;
}

function TopBar({ route }) {
  return html`<header className="topbar">
    <a className="brand" href="#home">DentalTQ<small>（仮称）提案デモ</small></a>
    <nav className="nav" aria-label="画面の切り替え">
      ${ROUTES.map(([id, label]) => html`<a key=${id} href=${'#' + id} aria-current=${route === id ? 'page' : undefined}>${label}</a>`)}
    </nav>
    <${ModeBadge} />
  </header>`;
}

function Notes() {
  useStoreVersion();
  if (!Store.error && !Store.note && !Store.busy) return null;
  return html`<div className="notes">
    ${Store.busy ? html`<div className="banner info" role="status">${Store.busy}</div>` : null}
    ${Store.error ? html`<div className="banner warn" role="alert"><span className="grow">${Store.error}</span>
      <button type="button" className="btn small ghost" onClick=${() => { Store.error = ''; Store.emit(); }}>閉じる</button></div>` : null}
    ${Store.note && !Store.error ? html`<div className="banner info"><span className="grow">${Store.note}</span>
      <button type="button" className="btn small ghost" onClick=${() => { Store.note = ''; Store.emit(); }}>閉じる</button></div>` : null}
  </div>`;
}

function Splash() {
  useStoreVersion();
  const local = () => { LS.set('dtq-mode', 'local'); Store.startLocal(''); };
  return html`<div className="center splash">
    <p className="splash-t"><span className="pulse" aria-hidden="true"></span>${Store.slow ? '共有データに接続できていません' : 'データに接続しています'}</p>
    <p className="muted">${Store.slow ? 'ネットワークを確かめるか、この端末の中だけで試してください。' : '少しお待ちください。'}</p>
    <div><button type="button" className="btn" onClick=${local}>この端末だけで試す</button></div>
  </div>`;
}

function EmptyDb() {
  useStoreVersion();
  const [busy, setBusy] = useState(false);
  const seed = async () => { setBusy(true); await Store.resetDemo(); setBusy(false); };
  return html`<div className="page"><${Empty} title="デモデータがまだありません">
    ${Store.mode === 'shared'
      ? html`<p>架空の医院と患者さんのデータを入れて、デモを始められる状態にします。</p>
        <button type="button" className="btn primary" disabled=${busy} onClick=${seed}>${busy ? (Store.busy || '用意しています') : 'デモデータを用意する'}</button>`
      : html`<p>デモの持ち主がデータを用意するまでお待ちください。自分で操作して試すときは、この端末の中だけで試せます。</p>
        <button type="button" className="btn" onClick=${() => { LS.set('dtq-mode', 'local'); location.reload(); }}>この端末だけで試す</button>`}
  <//></div>`;
}

function HomeView() {
  useStoreVersion();
  const settings = Store.get('settings', 'clinic') || {};
  const m = Store.mode;
  const tip = m === 'shared'
    ? 'いまは端末間で同期しています。PCで「受付」、iPadやスマホで「院内iPad」を開くと、同じデータが動く様子を確かめられます。'
    : m === 'readonly'
      ? 'このアカウントでは共有データを見ることだけができます。自分で操作して試すときは、「管理」から「この端末だけで試す」に切り替えてください。'
      : 'いまはこの端末の中だけで動いています。同じ端末で「受付」と「院内iPad」を別のタブで開くと連動します。';
  const steps = [
    { who: '受付', title: '患者さんを受け付けて、問診を送る', body: '名前で探すか、はじめての方はフリガナだけを入れます。問診は院内のiPadか、患者さんのスマホに届きます。', links: [['reception', '受付を開く']] },
    { who: '患者さん', title: 'iPadかスマホで問診に答える', body: '1画面に1問、大きな文字で答えます。痛む場所は歯の図を押して選びます。英語にも切り替えられます。', links: [['kiosk', '院内iPadを開く'], ['phone', 'スマホで問診を開く']] },
    { who: '診療室', title: '回答と要注意事項を、答えているそばから確かめる', body: '服薬やアレルギーの回答から要注意の候補を出し、先生が確かめたものだけを残します。', links: [['clinic', '診療室を開く']] },
    { who: '診療室から患者さんへ', title: '治療の内容をマイページに残す', body: '処置と部位を選ぶと、患者さん向けのやさしい文章ができます。患者さんは自宅から見返せます。', links: [['mypage', 'マイページを開く']] },
    { who: '医院', title: '定期検診のお知らせを送る', body: '前回の来院から間があいた方を抜き出して、まとめてお知らせします。', links: [['admin', '管理を開く']] },
  ];
  const road = [
    { t: 'いま', h: 'このデモで流れを確かめる', b: '画面と業務の流れ、問診の設問を、先生と一緒に確かめます。気になる点は、この画面にコメントで残せます。' },
    { t: '次に', h: '先生の意見で作り直す', b: '設問の監修、画面の言葉、受付の手順を直します。このデモをそのまま更新していきます。' },
    { t: '本番', h: 'アプリとして作る', b: '同じ画面と問診データの形を引き継ぎ、医療情報の安全管理のガイドラインに沿った環境で作り直します。' },
    { t: 'その先', h: '広げる', b: 'パイロット医院での運用、定期検診のお知らせの自動化、予約システムやレセコンとの連携へ進みます。' },
  ];
  return html`<div className="page home">
    <section className="hero">
      <p className="hero-kicker">${(settings.name || 'みどり歯科クリニック')}（架空）を舞台にした提案用デモ</p>
      <h1>問診の回答が、その場で受付と診療室に届く。</h1>
      <p className="lead">紙の問診票をやめて、患者さんが答えたそばから受付と診療室で読めるようにします。治療の内容は患者さんのマイページに残り、定期検診のお知らせにつながります。</p>
      <div className="tip"><${ModeBadge} /><span className="grow">${tip}</span></div>
    </section>
    <section aria-labelledby="flow-h">
      <h2 id="flow-h" className="sec-title">デモの進め方</h2>
      <ol className="flow">
        ${steps.map((s, i) => html`<li key=${i}>
          <span className="flow-n" aria-hidden="true">${i + 1}</span>
          <div>
            <p className="flow-who">${s.who}</p>
            <h3>${s.title}</h3>
            <p>${s.body}</p>
            <div className="row gap wrap">${s.links.map(l => html`<a key=${l[0]} className="btn small" href=${'#' + l[0]}>${l[1]}</a>`)}</div>
          </div>
        </li>`)}
      </ol>
    </section>
    <section aria-labelledby="road-h">
      <h2 id="road-h" className="sec-title">本番までの道筋</h2>
      <ol className="road">
        ${road.map(r => html`<li key=${r.t}><p className="road-t">${r.t}</p><h3>${r.h}</h3><p>${r.b}</p></li>`)}
      </ol>
    </section>
    <p className="fineprint">登場する医院と患者さんはすべて架空です。実在の患者さんの情報は入力しないでください。郵便番号から住所を出すデータは、日本郵便株式会社が公開している郵便番号データを加工して使っています。</p>
  </div>`;
}

function App() {
  useStoreVersion();
  const [route, setRoute] = useState(readRoute);
  useEffect(() => {
    const f = () => setRoute(readRoute());
    window.addEventListener('hashchange', f);
    return () => window.removeEventListener('hashchange', f);
  }, []);
  const chromeless = route === 'kiosk' || route === 'phone';
  let body;
  if (!Store.ready) body = html`<${Splash} />`;
  else if ((Store.mode === 'shared' || Store.mode === 'readonly') && !Store.has('settings', 'clinic') && Store.list('patients').length === 0) body = html`<${EmptyDb} />`;
  else if (route === 'reception') body = html`<${ReceptionView} />`;
  else if (route === 'clinic') body = html`<${ClinicView} />`;
  else if (route === 'kiosk') body = html`<${KioskView} />`;
  else if (route === 'phone') body = html`<${PhoneView} />`;
  else if (route === 'mypage') body = html`<${MyPageView} />`;
  else if (route === 'admin') body = html`<${AdminView} />`;
  else body = html`<${HomeView} />`;
  return html`<${Fragment}>
    ${chromeless ? null : html`<${TopBar} route=${route} />`}
    ${chromeless ? (Store.error ? html`<div className="notes floating" role="alert">${Store.error}</div>` : null) : html`<${Notes} />`}
    <main id="main" className=${chromeless ? 'chromeless' : ''}>${body}</main>
  <//>`;
}

window.__dtqStarted = true;
if (window.__dtqBootTimer) clearTimeout(window.__dtqBootTimer);
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
Store.boot();

</script>
</body>
</html>
