<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DentalTQ（仮称）提案デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root {
  --paper: #F3F5F4; --surface: #FFFFFF; --surface-2: #E9EDEB; --line: #D3DAD7; --line-strong: #A9B4B0;
  --ink: #1C2830; --ink-2: #46545D; --ink-3: #66737B;
  --ai: #24477A; --ai-ink: #FFFFFF; --ai-soft: #E2E9F3; --ai-deep: #183259;
  --yama: #C98A14; --yama-soft: #FAEFD7; --yama-ink: #5E3E04;
  --shu: #B8381F; --shu-soft: #F8E2DC; --shu-ink: #6E1C0C; --on-shu: #FFFFFF;
  --take: #357F55; --take-soft: #DEEFE4; --take-ink: #1A4A30; --on-take: #FFFFFF;
  --focus: #2F6FC4; --scrim: rgba(16, 24, 30, .55);
  --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --r-s: 6px; --r-m: 10px; --r-l: 18px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111619; --surface: #192024; --surface-2: #222B30; --line: #2F3A3F; --line-strong: #4B5960;
    --ink: #E6ECEE; --ink-2: #B6C1C6; --ink-3: #8F9CA3;
    --ai: #8FB2E6; --ai-ink: #0E1B2D; --ai-soft: #1F3049; --ai-deep: #C3D5F2;
    --yama: #E2AC48; --yama-soft: #372B13; --yama-ink: #F2D59D;
    --shu: #EC7B62; --shu-soft: #3B1E17; --shu-ink: #F6BBAC; --on-shu: #2A0E07;
    --take: #6CBF8E; --take-soft: #18301F; --take-ink: #AEE3C3; --on-take: #0C2215;
    --focus: #8FB2E6; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111619; --surface: #192024; --surface-2: #222B30; --line: #2F3A3F; --line-strong: #4B5960;
  --ink: #E6ECEE; --ink-2: #B6C1C6; --ink-3: #8F9CA3;
  --ai: #8FB2E6; --ai-ink: #0E1B2D; --ai-soft: #1F3049; --ai-deep: #C3D5F2;
  --yama: #E2AC48; --yama-soft: #372B13; --yama-ink: #F2D59D;
  --shu: #EC7B62; --shu-soft: #3B1E17; --shu-ink: #F6BBAC; --on-shu: #2A0E07;
  --take: #6CBF8E; --take-soft: #18301F; --take-ink: #AEE3C3; --on-take: #0C2215;
  --focus: #8FB2E6; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
#root { min-height: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.4; font-weight: 700; font-feature-settings: "palt"; }
p { margin: 0 0 .6em; }
a { color: var(--ai); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted, .meta { color: var(--ink-3); }
.meta { font-size: 13px; }
.pre { white-space: pre-wrap; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; }
.row.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 16px; }
.stack { display: grid; gap: 10px; margin: 12px 0; }
.err { color: var(--shu); font-weight: 700; margin: 12px 0 0; }
.hint { font-size: 14px; color: var(--ink-3); min-height: 1.4em; margin: 6px 0 0; }
.hint.warn { color: var(--yama-ink); font-weight: 700; }

/* 上部の帯 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand small { font-weight: 400; font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav a { padding: 6px 12px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; white-space: nowrap; font-size: 15px; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--ai-soft); color: var(--ai-deep); font-weight: 700; }
.mode { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.topbar .mode { margin-left: auto; }
.mode.shared { border-color: var(--take); color: var(--take-ink); background: var(--take-soft); }
.mode.readonly, .mode.local { border-color: var(--yama); color: var(--yama-ink); background: var(--yama-soft); }
@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; }
  .nav { order: 3; width: 100%; }
  .brand small { display: none; }
}
.notes { max-width: 1280px; margin: 10px auto 0; padding: 0 20px; }
.notes.floating { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 70; padding: 10px 14px; border-radius: var(--r-m); background: var(--yama-soft); color: var(--yama-ink); border: 1px solid var(--yama); }

/* ボタン・入力 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 7px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1.3; text-decoration: none; text-align: center; cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--ai-ink); }
.btn.primary:hover { background: var(--ai-deep); border-color: var(--ai-deep); }
.btn.danger { background: var(--shu); border-color: var(--shu); color: var(--on-shu); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.big { min-height: 60px; padding: 0 28px; font-size: 21px; border-radius: var(--r-m); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai-deep); }
.btn.inverse { background: var(--ai-ink); color: var(--ai); border-color: var(--ai-ink); }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--ai); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; text-align: left; }
.linkish.warn { color: var(--yama-ink); font-weight: 700; }
.linkish.small { font-size: 12px; }
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--surface); color: var(--ink); font-size: 16px; }
textarea { resize: vertical; line-height: 1.6; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--ai); flex: none; }
.field { display: block; margin: 0 0 12px; }
.field > span { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
.field.inline { display: flex; align-items: center; gap: 8px; margin: 0; }
.field.inline > span { margin: 0; white-space: nowrap; }
.field.inline select { width: auto; }
.check { display: flex; gap: 8px; align-items: center; margin: 8px 0 12px; font-size: 14px; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 640px) { .form-2 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--r-s); overflow: hidden; background: var(--surface); margin: 0 0 12px; }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 8px 14px; color: var(--ink-2); cursor: pointer; font-size: 15px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--ai-ink); font-weight: 700; }
.seg.lg button { padding: 12px 18px; font-size: 19px; }
.seg.sm { margin: 0; flex-wrap: nowrap; }
.seg.sm button { padding: 4px 10px; font-size: 13px; white-space: nowrap; }

/* 画面の器 */
main.chromeless { min-height: 100%; }
.page { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }
.page.wide { max-width: 1280px; }
.view-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
.view-h h1 { font-size: 28px; }
.view-h .sub { color: var(--ink-3); margin: 2px 0 0; font-size: 14px; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid; border-radius: var(--r-m); margin: 0 0 10px; }
.banner.call { background: var(--shu-soft); border-color: var(--shu); color: var(--shu-ink); }
.banner.warn { background: var(--yama-soft); border-color: var(--yama); color: var(--yama-ink); }
.banner.info { background: var(--ai-soft); border-color: var(--ai); color: var(--ai-deep); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 1040px) { .split { grid-template-columns: 1fr; } }
.side { display: grid; gap: 20px; }
.side-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; }
.side-sec h2 { font-size: 17px; margin-bottom: 10px; }
.scroll-x { overflow-x: auto; }
.empty { border: 1px dashed var(--line-strong); border-radius: var(--r-m); padding: 32px 24px; text-align: center; color: var(--ink-2); background: var(--surface); }
.empty-t { font-weight: 700; font-size: 18px; color: var(--ink); }
.center { min-height: 60vh; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; gap: 8px; }
.splash-t { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin: 0; }

/* 受付の台帳 */
.ledger { width: 100%; border-collapse: collapse; background: var(--surface); }
.ledger th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 700; padding: 8px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.ledger td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ledger tbody th { font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.ledger tr.call td { background: var(--shu-soft); }
.ledger tr.call td:first-child { box-shadow: inset 4px 0 0 var(--shu); }
.ledger tr.priority td:first-child { box-shadow: inset 4px 0 0 var(--yama); }
.ledger tr.done td, .ledger tr.done .name { color: var(--ink-3); }
.ledger tr.changed td { background: var(--yama-soft); }
.ledger.compact td, .ledger.compact th { padding: 6px 8px; }
.col-time { white-space: nowrap; width: 64px; }
.col-time strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.col-patient { min-width: 230px; }
.who { display: flex; align-items: center; gap: 10px; }
.name { font-weight: 700; }
.col-q { min-width: 150px; font-size: 14px; }
.code { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px dashed var(--line-strong); border-radius: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
.prog-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
.prog-line .prog { flex: 1; min-width: 60px; }
.prog { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--ai); transition: width .3s; }
select.status-select { width: auto; padding: 4px 8px; font-size: 13px; font-weight: 700; border-radius: 999px; }
select.status-select.st-answering { color: var(--ai); border-color: var(--ai); }
select.status-select.st-answered { background: var(--ai); color: var(--ai-ink); border-color: var(--ai); }
select.status-select.st-in_treatment { background: var(--take); color: var(--on-take); border-color: var(--take); }
select.status-select.st-treated { color: var(--take-ink); border-color: var(--take); }
select.status-select.st-done { color: var(--ink-3); }
.col-flags { min-width: 170px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.act { display: flex; gap: 6px; flex-wrap: wrap; }
.row-alert { margin-top: 6px; font-weight: 700; color: var(--shu-ink); font-size: 14px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2); margin-left: 6px; white-space: nowrap; vertical-align: 2px; }
.tag.new { border-color: var(--ai); color: var(--ai); font-weight: 700; margin: 4px 0 0; }
.tag.ok { border-color: var(--take); color: var(--take-ink); }
.pill { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
.pill.st-checked_in { color: var(--ink-2); }
.pill.st-answering { color: var(--ai); }
.pill.st-answered { background: var(--ai); color: var(--ai-ink); border-color: var(--ai); }
.pill.st-in_treatment { background: var(--take); color: var(--on-take); border-color: var(--take); }
.pill.st-treated { color: var(--take-ink); border-color: var(--take); }
.pill.st-done { color: var(--ink-3); }
.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-s); border: 1px solid; line-height: 1.5; }
.flag.high { background: var(--shu-soft); color: var(--shu-ink); border-color: var(--shu); }
.flag.mid { background: var(--yama-soft); color: var(--yama-ink); border-color: var(--yama); }
.flag.low { background: var(--surface-2); color: var(--ink-2); border-color: var(--line-strong); }
.flag.suggest { border-style: dashed; background: transparent; }
.flag.xs { font-size: 11px; padding: 0 5px; }
.flag-btn { border: 0; background: var(--surface); color: inherit; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; cursor: pointer; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: #FFFFFF; font-weight: 700; font-size: 17px; flex: none; overflow: hidden; background: var(--ai); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.sm { width: 32px; height: 32px; font-size: 14px; }
.avatar.lg { width: 64px; height: 64px; font-size: 26px; }
.avatar.doc { background: var(--ai); color: var(--ai-ink); }

/* 受付する・iPad */
.reg-body { margin-top: 2px; }
.results { list-style: none; margin: 0 0 12px; padding: 0; border: 1px solid var(--line); border-radius: var(--r-s); }
.results li + li { border-top: 1px solid var(--line); }
.results li.meta { padding: 8px 10px; }
.result { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; background: transparent; border: 0; text-align: left; cursor: pointer; }
.result:hover { background: var(--surface-2); }
.result .meta { display: block; }
.chosen { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.chosen .who { margin-bottom: 12px; }
.ticket { position: relative; margin-top: 16px; padding: 16px 20px; border: 2px dashed var(--line-strong); border-radius: var(--r-m); background: var(--paper); }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--surface); border: 2px dashed var(--line-strong); }
.ticket::before { left: -10px; }
.ticket::after { right: -10px; }
.ticket-h { font-size: 12px; font-weight: 700; color: var(--take-ink); margin: 0; }
.ticket-name { font-size: 20px; font-weight: 700; margin: 2px 0; }
.ticket-code { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0 6px; }
.ticket-code span { font-size: 13px; color: var(--ink-2); }
.ticket-code strong { font-size: 44px; letter-spacing: .14em; line-height: 1.1; color: var(--ai-deep); font-variant-numeric: tabular-nums; }
.ticket-code strong.dev { font-size: 28px; letter-spacing: 0; }
.dev-list { list-style: none; margin: 0 0 8px; padding: 0; }
.dev-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.free { background: var(--take); }
.dot.busy { background: var(--yama); }

/* 診療室 */
.clinic-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
.clinic-list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 96px); max-height: calc(100dvh - 96px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; }
@media (max-width: 900px) { .clinic-grid { grid-template-columns: 1fr; } .clinic-list { position: static; max-height: none; } }
.list-h { font-size: 13px; color: var(--ink-3); margin: 12px 0 6px; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pitem { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; width: 100%; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--r-s); background: transparent; text-align: left; cursor: pointer; }
.pitem:hover { background: var(--surface-2); }
.pitem.on { border-color: var(--ai); background: var(--ai-soft); }
.pitem .t { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pitem .n { font-weight: 700; }
.pitem .flag { grid-column: 2 / 4; justify-self: start; }
.clinic-detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 20px 24px 28px; min-width: 0; }
.pd-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.pd-who { flex: 1; min-width: 200px; }
.pd-name { font-size: 24px; font-weight: 700; margin: 0; }
.pd-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pd-sec, .mp-sec { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 12px; }
.sec-h h2 { font-size: 18px; }
.sec-h .meta { margin: 0; }
.suggest-box { margin-top: 12px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); display: grid; gap: 8px; justify-items: start; }
.suggest-box .meta { margin: 0; }
.ans-group { margin: 0 0 18px; }
.ans-group h3 { font-size: 14px; color: var(--ink-2); margin: 0 0 6px; }
.ans { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); }
.ans-row { display: contents; }
.ans dt { font-size: 13px; color: var(--ink-3); padding: 6px 16px 6px 0; border-bottom: 1px solid var(--line); }
.ans dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.ans-row.empty dd { color: var(--ink-3); font-weight: 400; }
@media (max-width: 560px) { .ans { grid-template-columns: 1fr; } .ans dt { border-bottom: 0; padding-bottom: 0; } }
.chart-mini { margin: 12px 0 0; max-width: 360px; }
.composer-grid { display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); gap: 20px; margin-top: 12px; }
@media (max-width: 760px) { .composer-grid { grid-template-columns: 1fr; } }
.proc-chips, .area-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ai); color: var(--ai-ink); border-color: var(--ai); font-weight: 700; }
.area-chips .chip { font-size: 18px; padding: 10px 18px; }
.post-admin { list-style: none; margin: 0; padding: 0; }
.post-admin li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }

  dateShort(ts) { if (!ts) return ''; const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + U.WD[d.getDay()] + '）'; },
  today() { const d = new Date(); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + U.WD[d.getDay()] + '）'; },
  sameDay(a, b) { const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); },
  ago(ts) {
    if (!ts) return '';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'たった今';
    if (m < 60) return m + '分前';
    const h = Math.floor(m / 60); if (h < 24) return h + '時間前';
    const d = Math.floor(h / 24); if (d < 31) return d + '日前';
    const mo = Math.floor(d / 30); if (mo < 12) return mo + 'か月前';
    return Math.floor(d / 365) + '年前';
  },
  age(birth, at) {
    if (!birth) return null;
    const p = String(birth).split('-').map(Number);
    if (p.length !== 3 || p.some(isNaN)) return null;
    const t = new Date(at || Date.now());
    let a = t.getFullYear() - p[0];
    if (t.getMonth() + 1 < p[1] || (t.getMonth() + 1 === p[1] && t.getDate() < p[2])) a--;
    return a;
  },
  ERAS: [
    { id: 'reiwa', ja: '令和', en: 'Reiwa', start: 2019 },
    { id: 'heisei', ja: '平成', en: 'Heisei', start: 1989 },
    { id: 'showa', ja: '昭和', en: 'Showa', start: 1926 },
    { id: 'taisho', ja: '大正', en: 'Taisho', start: 1912 },
    { id: 'ad', ja: '西暦', en: 'Year', start: 1 },
  ],
  eraYear(era, n) { if (era === 'ad') return n; const e = U.ERAS.find(x => x.id === era); return e ? e.start + n - 1 : n; },
  eraOf(y, m, d) {
    const v = y * 10000 + m * 100 + d;
    if (v >= 20190501) return { era: 'reiwa', n: y - 2018 };
    if (v >= 19890108) return { era: 'heisei', n: y - 1988 };
    if (v >= 19261225) return { era: 'showa', n: y - 1925 };
    if (v >= 19120730) return { era: 'taisho', n: y - 1911 };
    return { era: 'ad', n: y };
  },
  wareki(y, m, d) {
    const e = U.eraOf(y, m, d);
    if (e.era === 'ad') return y + '年';
    const name = U.ERAS.find(x => x.id === e.era).ja;
    return name + (e.n === 1 ? '元' : e.n) + '年';
  },
  birthText(birth) {
    if (!birth) return '';
    const [y, m, d] = String(birth).split('-').map(Number);
    const a = U.age(birth);
    return U.wareki(y, m, d) + m + '月' + d + '日（' + y + '年）' + (a != null ? '・' + a + '歳' : '');
  },
  kata(s) { return (s || '').replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60)); },
  digits(s) { return String(s || '').replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, ''); },
  telText(t) {
    const s = U.digits(t);
    if (s.length === 11) return s.slice(0, 3) + '-' + s.slice(3, 7) + '-' + s.slice(7);
    if (s.length === 10) return s.slice(0, 2) + '-' + s.slice(2, 6) + '-' + s.slice(6);
    return s;
  },
  zipText(z) { const s = U.digits(z); return s.length === 7 ? s.slice(0, 3) + '-' + s.slice(3) : s; },
  addrText(a) {
    if (!a) return '';
    const body = [a.pref, a.city, a.town, a.line].filter(Boolean).join('');
    return (a.zip ? '〒' + U.zipText(a.zip) + ' ' : '') + body;
  },
  hue(s) { let h = 0; for (const ch of String(s || '')) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; },
  displayName(p) { if (!p) return '（不明）'; return p.kanji || p.kana || '（名前未入力）'; },
  safeImg(src) { return typeof src === 'string' && /^data:image\/(png|jpe?g|webp);base64,/.test(src) ? src : null; },
};

/* ---------- 郵便番号 → 住所（日本郵便の郵便番号データを加工したものを遅延読込） ---------- */
const POSTAL_URL = "remote";
const PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const Postal = {
  data: null, promise: null, cache: {}, remote: {},
  FALLBACK: {
    '1000001': ['東京都', '千代田区', '千代田'], '1020083': ['東京都', '千代田区', '麹町'],
    '1100001': ['東京都', '台東区', '谷中'], '1100005': ['東京都', '台東区', '上野'],
    '1110032': ['東京都', '台東区', '浅草'], '1130022': ['東京都', '文京区', '千駄木'],
    '1350061': ['東京都', '江東区', '豊洲'], '1500001': ['東京都', '渋谷区', '神宮前'],
    '1600023': ['東京都', '新宿区', '西新宿'], '1700013': ['東京都', '豊島区', '東池袋'],
    '2200011': ['神奈川県', '横浜市西区', '高島'], '3300063': ['埼玉県', 'さいたま市浦和区', '高砂'],
    '4600008': ['愛知県', '名古屋市中区', '栄'], '5300001': ['大阪府', '大阪市北区', '梅田'],
    '8120011': ['福岡県', '福岡市博多区', '博多駅前'], '9800021': ['宮城県', '仙台市青葉区', '中央'],
    '0600001': ['北海道', '札幌市中央区', '北一条西'], '7300011': ['広島県', '広島市中区', '基町'],
  },
  load() {
    if (this.data) return Promise.resolve(this.data);
    if (!POSTAL_URL || POSTAL_URL === 'remote' || typeof fetch !== 'function') return Promise.reject(new Error('no-postal-data'));
    if (!this.promise) {
      this.promise = fetch(POSTAL_URL)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(d => { this.data = d; return d; })
        .catch(e => { this.promise = null; throw e; });
    }
    return this.promise;
  },
  prefetch() { this.load().catch(() => {}); },
  async lookupRemote(z) {
    const pre = z.slice(0, 3);
    if (!this.remote[pre]) {
      this.remote[pre] = (async () => {
        const urls = ['https://cdn.jsdelivr.net/gh/yubinbango/yubinbango-data@master/data/' + pre + '.js',
          'https://raw.githubusercontent.com/yubinbango/yubinbango-data/master/data/' + pre + '.js'];
        let missing = false;
        for (const u of urls) {
          try {
            const r = await fetch(u);
            if (r.status === 404) { missing = true; continue; }
            if (!r.ok) continue;
            const t = await r.text();
            return JSON.parse(t.slice(t.indexOf('(') + 1, t.lastIndexOf(')')));
          } catch (e) { /* 次の取得先へ */ }
        }
        return missing ? {} : null;
      })();
    }
    const d = await this.remote[pre];
    if (!d) {
      delete this.remote[pre];
      const f = this.FALLBACK[z];
      return f ? { pref: f[0], city: f[1], town: f[2] } : null;
    }
    const v = d[z];
    return v ? { pref: PREFS[Number(v[0]) - 1] || '', city: v[1] || '', town: v[2] || '' } : null;
  },
  async lookup(zip) {
    const z = U.digits(zip);
    if (z.length !== 7) return null;
    if (POSTAL_URL === 'remote' && typeof fetch === 'function') return this.lookupRemote(z);
    let d;
    try { d = await this.load(); } catch (e) {
      const f = this.FALLBACK[z];
      return f ? { pref: f[0], city: f[1], town: f[2] } : null;
    }
    const pre = z.slice(0, 3);
    if (!this.cache[pre]) {
      const m = {};
      const b = d.b[pre];
      if (b) for (const part of b.split(';')) {
        const i1 = part.indexOf(','), i2 = part.indexOf(',', i1 + 1);
        m[part.slice(0, i1)] = [parseInt(part.slice(i1 + 1, i2), 36), part.slice(i2 + 1)];
      }
      this.cache[pre] = m;
    }
    const hit = this.cache[pre][z.slice(3)];
    if (!hit) return null;
    const c = d.cities[hit[0]];
    const k = c.indexOf('|');
    return { pref: d.prefs[Number(c.slice(0, k)) - 1], city: c.slice(k + 1), town: hit[1] };
  },
};

/* ---------- 分岐条件（本番ではテンプレートJSONとしてDBに保存する想定） ---------- */
function cond(c, ctx) {
  if (!c) return true;
  if (c.all) return c.all.every(x => cond(x, ctx));
  if (c.any) return c.any.some(x => cond(x, ctx));
  if (c.not) return !cond(c.not, ctx);
  const v = c.q ? (ctx.answers || {})[c.q] : ctx[c.ctx];
  if ('eq' in c) return v === c.eq;
  if ('ne' in c) return v !== c.ne;
  if (c.in) return c.in.includes(v);
  if (c.hasAny) return Array.isArray(v) && v.some(x => c.hasAny.includes(x));
  if ('gte' in c) return v != null && v >= c.gte;
  if ('lte' in c) return v != null && v <= c.lte;
  return true;
}

function composePost(procIds, teeth, nextPlan) {
  const teethText = teeth && teeth.length ? TOOTH.sort(teeth).map(f => TOOTH.plain(f)).join('、') : '対象の歯';
  const procs = procIds.map(id => PROCEDURES.find(p => p.id === id)).filter(Boolean);
  const lines = procs.map(p => p.text.replace('{teeth}', teethText));
  const afters = [...new Set(procs.map(p => p.after).filter(Boolean))];
  let body = lines.join('\n');
  if (afters.length) body += '\n\n' + afters.join('\n');
  if (nextPlan && nextPlan.trim()) body += '\n\n次回：' + nextPlan.trim();
  return body;
}

/* ---------- テンプレート評価 ---------- */
function templateOf(id) { return TEMPLATES[id] || TEMPLATES.new; }
function makeCtx(answers, patient, hadPhoto) {
  const a = answers || {};
  const birth = a.birth || (patient && patient.birth);
  return { answers: a, age: U.age(birth), sex: a.sex || (patient && patient.sex) || '', hadPhoto: !!hadPhoto };
}
function visibleQs(tpl, ctx) { return tpl.questions.filter(q => cond(q.showIf, ctx)); }
function answeredView(visit, patient) {
  /* 表示中の設問だけを対象にする（分岐で消えた設問の古い回答は使わない） */
  const tpl = templateOf(visit && visit.templateId);
  const answers = (visit && visit.answers) || {};
  const ctx = makeCtx(answers, patient, visit && visit.hadPhoto);
  const qs = visibleQs(tpl, ctx);
  const used = {};
  for (const q of qs) if (answers[q.id] !== undefined) used[q.id] = answers[q.id];
  return { tpl, qs, answers: used, ctx: { ...ctx, answers: used } };
}
function suggestAlerts(visit, patient) {
  if (!visit || !visit.answers) return [];
  const { ctx } = answeredView(visit, patient);
  return ALERT_RULES.filter(r => cond(r.when, ctx));
}
function isPriority(visit) { return !!(visit && visit.answers && visit.answers.pain_level === 'severe'); }

function optLabel(q, id, lang) {
  const o = (q.options || []).find(x => x.id === id);
  return o ? tr(o.label, lang) : id;
}
function fmtAnswer(q, v, lang, forStaff) {
  lang = lang || 'ja';
  if (v === undefined || v === null || v === '') return '';
  const sep = lang === 'en' ? ', ' : '、';
  switch (q.type) {
    case 'single': case 'profile': return optLabel(q, v, lang);
    case 'multi': return (v || []).map(id => optLabel(q, id, lang)).join(sep);
    case 'name': return (v.kanji ? v.kanji + '（' + (v.kana || '') + '）' : (v.kana || ''));
    case 'birth': return lang === 'en' ? v : U.birthText(v);
    case 'contact': {
      const parts = [U.telText(v.tel)];
      if (v.email) parts.push(v.email);
      parts.push(lang === 'en' ? (v.consent ? 'Reminders: yes' : 'Reminders: no') : (v.consent ? 'お知らせ：受け取る' : 'お知らせ：受け取らない'));
      return parts.join(' ／ ');
    }
    case 'address': return U.addrText(v);
    case 'teeth': {
      const t = TOOTH.sort(v.teeth).map(f => forStaff ? TOOTH.code(f) : TOOTH.plain(f, lang));
      const a = (v.areas || []).map(id => { const x = TOOTH.AREAS.find(y => y.id === id); return x ? tr(x.label, lang) : id; });
      return [...t, ...a].join(sep);
    }
    case 'photo': return v ? (lang === 'en' ? 'Taken' : '撮影した') : (lang === 'en' ? 'Skipped' : '撮影しない');
    default: return String(v);
  }
}
function validate(q, v, lang) {
  switch (q.type) {
    case 'info': case 'review': return null;
    case 'name': {
      const k = U.kata((v && v.kana) || '').trim();
      if (!k) return UI.kanaErr;
      if (lang !== 'en' && !/^[\u30A0-\u30FF\s\u3000]+$/.test(k)) return UI.kanaErr;
      return null;
    }
    case 'birth': return v && U.age(v) != null && U.age(v) >= 0 && U.age(v) <= 120 ? null : UI.birthErr;
    case 'contact': { const n = U.digits(v && v.tel).length; return n >= 10 && n <= 11 ? null : UI.telErr; }
    case 'address': return v && U.digits(v.zip).length === 7 && v.pref && v.city && (v.line || '').trim() ? null : UI.addrErr;
    case 'teeth': return v && ((v.teeth || []).length + (v.areas || []).length) > 0 ? null : UI.teethErr;
    case 'multi': return !q.required || (Array.isArray(v) && v.length) ? null : UI.required;
    case 'single': case 'profile': return !q.required || v ? null : UI.required;
    default: return null;
  }
}
function describeCond(c) {
  if (!c) return '';
  if (c.all) return c.all.map(describeCond).join('、かつ');
  if (c.any) return c.any.map(describeCond).join('、または');
  if (c.ctx === 'age') return '年齢が' + ('gte' in c ? c.gte + '歳以上' : c.lte + '歳以下');
  if (c.ctx === 'sex') return '性別が女性';
  if (c.ctx === 'hadPhoto') return '顔写真がまだない';
  const q = Q[c.q];
  const name = q ? (q.staff || tr(q.title)) : c.q;
  const lab = id => (q ? optLabel(q, id, 'ja') : id);
  if ('eq' in c) return '「' + name + '」が「' + lab(c.eq) + '」';
  if (c.in) return '「' + name + '」が「' + c.in.map(lab).join('／') + '」';
  if (c.hasAny) return '「' + name + '」で「' + c.hasAny.map(lab).join('／') + '」のどれか';
  return name;
}

/* ---------- データ層
   共有モード：claude.ai の共有DB（端末間でリアルタイム同期）
   ローカルモード：この端末のブラウザ内だけ（同じ端末の別タブとは同期）
   本番では、この Store の中身を Supabase（東京リージョン）に差し替える想定。
   コレクション名・ドキュメントの形はそのままテーブル設計の下書きになる。 ---------- */
const COLLS = ['settings', 'patients', 'photos', 'visits', 'devices', 'posts', 'messages', 'notices'];
const LSK = 'dtq-demo-v1:';
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
function deepMerge(base, patch) {
  const out = isObj(base) ? { ...base } : {};
  for (const k of Object.keys(patch)) {
    const v = patch[k];
    out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}
const strip = o => { if (!o) return o; const { id, ...rest } = o; return rest; };

const Store = {
  mode: 'connecting', /* connecting | local | shared | readonly */
  ready: false, slow: false, version: 0,
  data: {}, arrs: {}, loaded: {}, listeners: new Set(), chains: {},
  db: null, canWrite: true, canEdit: false, isOwner: false,
  note: '', error: '', busy: '',

  emit() { this.version++; for (const fn of [...this.listeners]) fn(); },
  subscribe(fn) { this.listeners.add(fn); return () => { this.listeners.delete(fn); }; },
  list(c) {
    if (!this.arrs[c]) {
      const m = this.data[c];
      this.arrs[c] = m ? [...m.entries()].map(([id, v]) => ({ ...v, id })) : [];
    }
    return this.arrs[c];
  },
  get(c, id) {
    if (!id) return null;
    const m = this.data[c];
    const v = m && m.get(id);
    return v ? { ...v, id } : null;
  },
  has(c, id) { return !!(this.data[c] && this.data[c].has(id)); },
  _put(c, id, v) {
    if (!this.data[c]) this.data[c] = new Map();
    if (v == null) this.data[c].delete(id); else this.data[c].set(id, v);
    this.arrs[c] = null;
  },

  async boot() {
    const forced = LS.get('dtq-mode') === 'local';
    const cl = window.claude;
    if (forced || !cl || typeof cl.use !== 'function') {
      this.startLocal(forced ? '' : 'このデモは、開いた端末の中だけで動きます。入力した内容は、この端末のブラウザにだけ残ります。');
      return;
    }
    this.mode = 'connecting'; this.emit();
    let db = null, user = null;
    try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch (e) { db = null; }
    if (this.mode !== 'connecting') return;
    if (!db) { this.startLocal('共有データに接続できないため、この端末の中だけで動いています。'); return; }
    if (user) {
      try {
        const w = await user.can('data.write');
        if (w === false) { this.startLocal('このアカウントでは共有データを変更できないため、この端末の中だけで動かしています。操作した内容は、この端末にだけ残ります。'); return; }
        this.canWrite = w !== false;
        this.canEdit = !!(await user.canEdit());
        this.isOwner = !!(await user.isOwner());
      } catch (e) { /* 判定できないときは書き込みを試し、拒否されたら閲覧のみに切り替える */ }
    }
    this.startShared(db);
  },

  startLocal(note) {
    this.mode = 'local'; this.canWrite = true; this.canEdit = true; this.note = note || '';
    let empty = true;
    for (const c of COLLS) {
      const obj = LS.getJSON(LSK + c);
      this.data[c] = new Map(Object.entries(obj || {}));
      this.arrs[c] = null;
      if (obj && Object.keys(obj).length) empty = false;
    }
    if (empty) this._seedLocal();
    window.addEventListener('storage', e => {
      if (!e.key || !e.key.startsWith(LSK)) return;
      const c = e.key.slice(LSK.length);
      if (!COLLS.includes(c)) return;
      this.data[c] = new Map(Object.entries(LS.getJSON(e.key) || {}));
      this.arrs[c] = null;
      this.emit();
    });
    this.ready = true;
    this.emit();
  },
  _seedLocal() {
    const s = buildSeed(Date.now());
    for (const c of COLLS) {
      this.data[c] = new Map(Object.entries(s[c] || {}));
      this.arrs[c] = null;
      LS.setJSON(LSK + c, s[c] || {});
    }
  },
  _persist(c) {
    const obj = {};
    for (const [k, v] of this.data[c] || []) obj[k] = v;
    if (!LS.setJSON(LSK + c, obj)) {
      this.error = 'この端末の保存領域がいっぱいです。「管理」からデモを初期状態に戻してください。';
    }
  },

  startShared(db) {
    this.db = db;
    this.mode = this.canWrite ? 'shared' : 'readonly';
    let first = 0;
    const timer = setTimeout(() => { if (!this.ready) { this.slow = true; this.emit(); } }, 10000);
    for (const c of COLLS) {
      this.data[c] = new Map(); this.arrs[c] = null;
      db.collection(c).onSnapshot(snap => {
        if (this.mode === 'local') return;
        const m = new Map();
        for (const doc of snap.docs) if (doc.exists) m.set(doc.id, doc.data());
        this.data[c] = m; this.arrs[c] = null;
        if (!this.loaded[c]) {
          this.loaded[c] = true; first++;
          if (first === COLLS.length) { this.ready = true; this.slow = false; clearTimeout(timer); }
        }
        this.emit();
      }, err => {
        if (this.mode === 'local') return;
        this.error = 'データの受信が止まりました（' + ((err && err.code) || 'error') + '）。ページを開き直してください。';
        this.ready = true; clearTimeout(timer);
        this.emit();
      });
    }
    this.emit();
  },

  /* 書き込みは同じドキュメントごとに1件ずつ順番に送る */
  _chain(key, op) {
    const prev = this.chains[key] || Promise.resolve();
    const p = prev.catch(() => {}).then(op);
    this.chains[key] = p;
    return p;
  },
  _fail(e, c, id) {
    const code = e && e.code;
    if (code === 'invalid_argument' && this.mode === 'shared') {
      this.mode = 'readonly'; this.canWrite = false;
      this.error = 'このアカウントでは共有データを変更できません。「管理」の「この端末だけで試す」に切り替えると操作できます。';
    } else if (code === 'quota_exceeded') {
      this.error = 'デモデータの保存上限に達しました。「管理」から初期状態に戻してください。';
    } else {
      this.error = '保存できませんでした（' + (code || 'error') + '）。もう一度お試しください。';
    }
    this.emit();
    return false;
  },
  _readonly() {
    if (!this.error) this.error = 'このアカウントでは共有データを変更できません。「管理」の「この端末だけで試す」に切り替えると操作できます。';
    this.emit();
    return Promise.resolve(false);
  },
  set(c, id, v) {
    const body = strip(clone(v));
    if (this.mode === 'local') { this._put(c, id, body); this._persist(c); this.emit(); return Promise.resolve(true); }
    if (this.mode !== 'shared') return this._readonly();
    return this._chain(c + '/' + id, () => this.db.collection(c).doc(id).set(body)).then(() => true, e => this._fail(e, c, id));
  },
  update(c, id, patch) {
    const body = clone(patch);
    if (this.mode === 'local') {
      const cur = this.data[c] && this.data[c].get(id);
      this._put(c, id, deepMerge(cur || {}, body)); this._persist(c); this.emit();
      return Promise.resolve(true);
    }
    if (this.mode !== 'shared') return this._readonly();
    const exists = this.has(c, id);
    return this._chain(c + '/' + id, () => exists
      ? this.db.collection(c).doc(id).update(body)
      : this.db.collection(c).doc(id).set(deepMerge({}, body))).then(() => true, e => this._fail(e, c, id));
  },
  remove(c, id) {
    if (this.mode === 'local') { this._put(c, id, null); this._persist(c); this.emit(); return Promise.resolve(true); }
    if (this.mode !== 'shared') return this._readonly();
    return this._chain(c + '/' + id, () => this.db.collection(c).doc(id).delete()).then(() => true, e => this._fail(e, c, id));
  },

  async resetDemo() {
    const seed = buildSeed(Date.now());
    SS.del('dtq-phone-visit'); LS.del('dtq-clinic-sel');
    if (this.mode === 'local') {
      for (const c of COLLS) {
        this.data[c] = new Map(Object.entries(seed[c] || {}));
        this.arrs[c] = null;
        LS.setJSON(LSK + c, seed[c] || {});
      }
      this.error = '';
      this.emit();
      return true;
    }
    if (this.mode !== 'shared') return false;
    let ok = true;
    const total = COLLS.reduce((n, c) => n + (this.data[c] ? this.data[c].size : 0) + Object.keys(seed[c] || {}).length, 0);
    let done = 0;
    const tick = () => { done++; this.busy = '初期状態に戻しています（' + Math.min(100, Math.round(done / total * 100)) + '%）'; this.emit(); };
    for (const c of COLLS) {
      for (const id of [...(this.data[c] || new Map()).keys()]) {
        if (!(seed[c] && seed[c][id])) { ok = (await this.remove(c, id)) && ok; }
        tick();
      }
    }
    for (const c of COLLS) {
      for (const [id, v] of Object.entries(seed[c] || {})) { ok = (await this.set(c, id, v)) && ok; tick(); }
    }
    this.busy = '';
    if (ok) this.error = '';
    this.emit();
    return ok;
  },
};

  useEffect(() => {
    const k = e => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (/^[0-9]$/.test(e.key)) { ref.current(e.key); e.preventDefault(); }
      else if (e.key === 'Backspace') { ref.current('del'); e.preventDefault(); }
      else if (extra && e.key === extra) { ref.current(extra); e.preventDefault(); }

  }, [extra]);
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', extra || '', '0', 'del'];

/* ---------- 歯式チャート ----------
   view = 'patient'：患者から見た左右（あなたの右が画面の右）
   view = 'dentist'：術者から見た向き（患者の右が画面の左。カルテの標準） */
function archLayout(view, deciduous) {
  const per = deciduous ? 5 : 8;
  const widths = deciduous ? [0.9, 0.85, 0.95, 1.1, 1.2] : [0.85, 0.8, 0.9, 0.95, 0.95, 1.2, 1.15, 1.05];
  const total = widths.reduce((a, b) => a + b, 0);
  const A = (deciduous ? 74 : 82) * Math.PI / 180;
  const arches = [
    { upper: true, base: 150, rx: deciduous ? 140 : 168, ry: deciduous ? 96 : 112 },
    { upper: false, base: 196, rx: deciduous ? 140 : 168, ry: deciduous ? 96 : 112 },
  ];
  const out = [];
  for (const ar of arches) {
    const qR = ar.upper ? (deciduous ? 5 : 1) : (deciduous ? 8 : 4);
    const qL = ar.upper ? (deciduous ? 6 : 2) : (deciduous ? 7 : 3);
    const screenRight = view === 'patient' ? qR : qL;
    const screenLeft = view === 'patient' ? qL : qR;
    for (const [q, dir] of [[screenRight, 1], [screenLeft, -1]]) {
      let cum = 0;
      for (let n = 1; n <= per; n++) {
        const w = widths[n - 1];
        const mid = (cum + w / 2) / total; cum += w;
        const th = Math.PI / 2 - dir * mid * A;
        const x = 210 + ar.rx * Math.cos(th);
        const y = ar.upper ? ar.base - ar.ry * Math.sin(th) : ar.base + ar.ry * Math.sin(th);
        const dx = -ar.rx * Math.sin(th);
        const dy = ar.upper ? -ar.ry * Math.cos(th) : ar.ry * Math.cos(th);
        out.push({ fdi: q * 10 + n, n, x, y, rot: Math.atan2(dy, dx) * 180 / Math.PI, w });
      }
    }
  }
  return out;
}

function ToothChart({ view, selected, onToggle, deciduous, lang, compact }) {
  const sel = new Set(selected || []);
  const teeth = useMemo(() => archLayout(view, deciduous), [view, deciduous]);
  const interactive = !!onToggle;
  const rightLabel = view === 'patient' ? (lang === 'en' ? 'Right' : '右') : '患者の左';
  const leftLabel = view === 'patient' ? (lang === 'en' ? 'Left' : '左') : '患者の右';
  return html`<svg className=${'tooth-chart' + (compact ? ' compact' : '')} viewBox="0 0 420 340" role=${interactive ? 'group' : 'img'}
      aria-label=${view === 'patient' ? '歯の位置を選ぶ図（あなたから見た左右）' : '歯式（術者から見た向き）'}>
    <text className="chart-label" x="210" y="16" textAnchor="middle">${lang === 'en' ? 'Upper teeth' : '上の歯'}</text>
    <text className="chart-label" x="210" y="334" textAnchor="middle">${lang === 'en' ? 'Lower teeth' : '下の歯'}</text>
    <text className="chart-side" x=${view === 'patient' ? 406 : 414} y="178" textAnchor="end">${rightLabel}</text>
    <text className="chart-side" x=${view === 'patient' ? 14 : 6} y="178" textAnchor="start">${leftLabel}</text>
    ${teeth.map(t => {
      const on = sel.has(t.fdi);
      const rx = 9.5 * t.w + 1.5, ry = 12 * t.w;
      const label = TOOTH.code(t.fdi) + '（' + TOOTH.plain(t.fdi, lang) + '）';
      const toggle = () => onToggle && onToggle(t.fdi);
      return html`<g key=${t.fdi} className=${'tooth' + (on ? ' sel' : '')}
          role=${interactive ? 'button' : undefined} tabIndex=${interactive ? 0 : undefined}
          aria-pressed=${interactive ? on : undefined} aria-label=${label}
          onClick=${interactive ? toggle : undefined}
          onKeyDown=${interactive ? (e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }) : undefined}>
        ${interactive ? html`<circle className="hit" cx=${t.x} cy=${t.y} r=${15 * t.w} />` : null}
        <ellipse cx=${t.x} cy=${t.y} rx=${rx} ry=${ry} transform=${'rotate(' + t.rot.toFixed(1) + ' ' + t.x.toFixed(1) + ' ' + t.y.toFixed(1) + ')'} />
        ${view === 'dentist' ? html`<text x=${t.x} y=${t.y + 4} textAnchor="middle">${t.fdi >= 50 ? 'ABCDE'[t.n - 1] : t.n}</text>` : null}
      </g>`;
    })}
  </svg>`;
}

/* 画像を正方形に縮めてデータURLにする（顔写真用・約30KB） */
function shrinkImage(file, size) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const g = c.getContext('2d');
      g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

const Ops = {
  async setStatus(v, status) {
    const now = Date.now();
    const patch = { status, updatedAt: now };
    if (status === 'in_treatment') patch.treatStartedAt = now;
    if (status === 'done') patch.doneAt = now;
    await Store.update('visits', v.id, patch);
    if (['in_treatment', 'treated', 'done'].includes(status) && v.target && v.target.type === 'ipad') {
      const d = Store.get('devices', v.target.deviceId);
      if (d && d.visitId === v.id) await Store.set('devices', d.id, { ...strip(d), visitId: null, updatedAt: now });
    }
    if (status === 'done') await Store.update('patients', v.patientId, { lastVisitAt: now });
  },
  callPatient(v, message, messageEn) {
    return Store.update('visits', v.id, { staffCall: { message, messageEn: messageEn || '', at: Date.now(), ack: false } });
  },
  clearPatientCall(v) {
    return Store.update('visits', v.id, { patientCall: { active: false, reason: (v.patientCall && v.patientCall.reason) || '', handledAt: Date.now() } });
  },
  newCode() {
    const used = new Set(Store.list('visits').filter(v => v.status !== 'done').map(v => v.code));
    for (let i = 0; i < 50; i++) { const c = String(1000 + Math.floor(Math.random() * 9000)); if (!used.has(c)) return c; }
    return String(Date.now()).slice(-4);
  },
  nextPatientNo() {
    const max = Store.list('patients').reduce((m, p) => Math.max(m, parseInt(p.no, 10) || 0), 10000);
    return String(max + 1);
  },
  async createVisit({ patientId, templateId, dest, kana, isNew }) {
    const id = U.uid('v');
    const now = Date.now();
    const v = {
      patientId, templateId, templateVersion: templateOf(templateId).version,
      target: dest === 'phone' ? { type: 'phone' } : { type: 'ipad', deviceId: dest },
      code: Ops.newCode(), status: 'checked_in', progress: { step: 0, total: 0 }, answers: {}, lang: 'ja',
      isNew: !!isNew, kana: kana || '', hadPhoto: !!Store.get('photos', patientId),
      patientCall: null, staffCall: null, changeRequest: null, createdAt: now, updatedAt: now,
    };
    const ok = await Store.set('visits', id, v);
    if (!ok) return null;
    if (dest !== 'phone') {
      const d = Store.get('devices', dest);
      await Store.set('devices', dest, { label: (d && d.label) || dest, visitId: id, updatedAt: now });
    }
    return { ...v, id };
  },
  async createPatient(kana) {
    const id = U.uid('p');
    const now = Date.now();
    const ok = await Store.set('patients', id, {
      no: Ops.nextPatientNo(), kana: U.kata(kana).trim(), kanji: '', birth: '', sex: '', tel: '', email: '',
      consent: false, address: null, alerts: [], staffNote: '', verified: false, provisional: true,
      firstVisitAt: now, lastVisitAt: now, createdAt: now, updatedAt: now,
    });
    return ok ? id : null;
  },
  async freeDevice(d) {
    return Store.set('devices', d.id, { ...strip(d), visitId: null, updatedAt: Date.now() });
  },
  latestVisit(patientId) {
    return Store.list('visits').filter(v => v.patientId === patientId).sort((a, b) => b.createdAt - a.createdAt)[0] || null;
  },
};

      return { era: e.era, y: String(e.n), m: String(m), d: String(d) };

    return { era: 'showa', y: '', m: '', d: '' };
  }, []);
  const [era, setEra] = useState(init.era);
  const [f, setF] = useState({ y: init.y, m: init.m, d: init.d });
  const [focus, setFocus] = useState(init.y ? 'd' : 'y');
  const maxLen = { y: era === 'ad' ? 4 : 2, m: 2, d: 2 };
  const order = ['y', 'm', 'd'];
  useEffect(() => {
    const yy = parseInt(f.y, 10), mm = parseInt(f.m, 10), dd = parseInt(f.d, 10);
    let out = null;
    if (yy && mm && dd) {
      const gy = U.eraYear(era, yy);
      const dt = new Date(gy, mm - 1, dd);
      if (dt.getFullYear() === gy && dt.getMonth() === mm - 1 && dt.getDate() === dd && dt.getTime() <= Date.now()) {
        out = gy + '-' + U.pad(mm) + '-' + U.pad(dd);
      }
    }
    if (out !== (value || null)) set(out);
  }, [era, f.y, f.m, f.d]);
  function key(k) {
    const cur = f[focus] || '';
    const i = order.indexOf(focus);
    if (k === 'del') {
      if (cur) setF({ ...f, [focus]: cur.slice(0, -1) });
      else if (i > 0) { const pf = order[i - 1]; setFocus(pf); setF({ ...f, [pf]: (f[pf] || '').slice(0, -1) }); }
      return;
    }
    if (cur.length >= maxLen[focus]) {
      if (i < 2) { const nf = order[i + 1]; setFocus(nf); setF({ ...f, [nf]: k }); }
      return;
    }
    const nv = cur + k;
    setF({ ...f, [focus]: nv });
    if (nv.length >= maxLen[focus] && i < 2) setFocus(order[i + 1]);

  return html`<div className=${'opt-grid' + (q.options.length <= 3 ? ' few' : '')} role=${multi ? 'group' : 'radiogroup'} aria-labelledby="qt">
    ${q.options.map(o => {
      const on = multi ? arr.includes(o.id) : value === o.id;
      return html`<button type="button" key=${o.id} className=${'opt' + (multi ? ' multi' : '')}
        role=${multi ? undefined : 'radio'} aria-checked=${multi ? undefined : on} aria-pressed=${multi ? on : undefined}
        onClick=${() => click(o)}><span className="box" aria-hidden="true"></span><span>${tr(o.label, lang)}</span></button>`;
    })}
  </div>`;
}

function TeethStep({ value, set, lang, age }) {
  const v = value || { teeth: [], areas: [] };
  const [dec, setDec] = useState(() => (v.teeth || []).some(f => f >= 50) || (age != null && age < 6));
  const toggle = f => { const t = v.teeth || []; set({ ...v, teeth: t.includes(f) ? t.filter(x => x !== f) : [...t, f] }); };
  const toggleArea = id => { const a = v.areas || []; set({ ...v, areas: a.includes(id) ? a.filter(x => x !== id) : [...a, id] }); };
  const picked = [...TOOTH.sort(v.teeth).map(f => TOOTH.plain(f, lang)), ...(v.areas || []).map(id => tr((TOOTH.AREAS.find(a => a.id === id) || {}).label, lang))];
  return html`<div>
    ${age == null || age < 13 ? html`<${Seg} label="歯の種類" value=${dec ? 'dec' : 'perm'} onChange=${x => setDec(x === 'dec')}
        options=${[{ id: 'perm', label: lang === 'en' ? 'Adult teeth' : '大人の歯' }, { id: 'dec', label: lang === 'en' ? 'Baby teeth' : '子どもの歯（乳歯）' }]} />` : null}
    <div className="chart-wrap"><${ToothChart} view="patient" selected=${v.teeth} onToggle=${toggle} deciduous=${dec} lang=${lang} /></div>
    <div className="area-chips" role="group" aria-label=${lang === 'en' ? 'Other places' : '歯以外の場所'}>
      ${TOOTH.AREAS.map(a => html`<button type="button" key=${a.id} className="chip" aria-pressed=${(v.areas || []).includes(a.id)} onClick=${() => toggleArea(a.id)}>${tr(a.label, lang)}</button>`)}
    </div>
    <p className="picked" aria-live="polite">${picked.length ? (lang === 'en' ? 'Selected: ' : '選んだ場所：') + picked.join(lang === 'en' ? ', ' : '、') : ''}</p>
  </div>`;
}

function PhotoStep({ value, set, lang, patientId }) {
  const photo = useDoc('photos', patientId);
  const ref = useRef(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  async function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setBusy(true); setErr('');
    try {
      const data = await shrinkImage(file, 320);
      const ok = await Store.set('photos', patientId, { data, at: Date.now() });
      if (ok) set(true); else setErr(lang === 'en' ? 'Could not save the photo.' : '写真を保存できませんでした。');
    } catch (x) { setErr(lang === 'en' ? 'Could not read the photo. Please try again.' : '写真を読み込めませんでした。もう一度お試しください。'); }
    setBusy(false);
  }
  const src = photo && U.safeImg(photo.data);
  return html`<div className="photo-step">
    <div className="photo-frame">${src ? html`<img src=${src} alt=${lang === 'en' ? 'Your photo' : '撮影した写真'} />` : html`<span>${lang === 'en' ? 'No photo yet' : 'まだ撮影していません'}</span>`}</div>
    <input ref=${ref} type="file" accept="image/*" capture="user" className="visually-hidden" tabIndex="-1" aria-hidden="true" onChange=${onFile} />
    <div className="row gap wrap">
      <button type="button" className="btn primary big" disabled=${busy} onClick=${() => ref.current && ref.current.click()}>
        ${busy ? (lang === 'en' ? 'Saving…' : '保存しています…') : src ? (lang === 'en' ? 'Retake' : '撮り直す') : (lang === 'en' ? 'Take a photo' : '写真を撮る')}</button>
      <button type="button" className="btn big" aria-pressed=${value === false} onClick=${() => set(false)}>${lang === 'en' ? 'Skip' : '撮らない'}</button>
    </div>
    ${err ? html`<p className="err" role="alert">${err}</p>` : null}
  </div>`;
}

function ProfileStep({ q, value, set, lang, patient }) {
  const p = patient || {};
  const rows = lang === 'en'
    ? [['Name', U.displayName(p)], ['Date of birth', p.birth || '—'], ['Phone', p.tel ? U.telText(p.tel) : '—'], ['Address', p.address ? U.addrText(p.address) : '—']]
    : [['お名前', U.displayName(p)], ['生年月日', p.birth ? U.birthText(p.birth) : '—'], ['電話番号', p.tel ? U.telText(p.tel) : '—'], ['ご住所', p.address ? U.addrText(p.address) : '—']];
  return html`<div>
    <dl className="profile-card">${rows.map(r => html`<div key=${r[0]}><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`)}</dl>
    <${OptionsStep} q=${q} value=${value} set=${set} lang=${lang} />
  </div>`;
}

function ReviewStep({ qs, answers, lang, onEdit }) {
  const items = qs.filter(q => q.type !== 'info' && q.type !== 'review');
  return html`<dl className="review">
    ${items.map(q => {
      const txt = fmtAnswer(q, answers[q.id], lang, false);
      return html`<div key=${q.id} className="review-row">
        <dt>${tr(q.title, lang)}</dt>
        <dd>${txt || html`<span className="muted">${tr(UI.notAnswered, lang)}</span>`}</dd>
        <button type="button" className="btn small" onClick=${() => onEdit(qs.indexOf(q))}>${tr(UI.edit, lang)}</button>
      </div>`;
    })}
  </dl>`;
}

function initialAnswers(visit, patient) {
  const a = { ...((visit && visit.answers) || {}) };
  if (visit && visit.templateId === 'new' && !a.name) {
    a.name = { kana: visit.kana || (patient && patient.kana) || '', kanji: (patient && patient.kanji) || '' };
  }
  return a;
}
function prefillFor(q, visit, patient) {
  if (!patient || !visit || visit.templateId === 'new') return undefined;
  if (q.id === 'contact') return { tel: patient.tel || '', email: patient.email || '', consent: !!patient.consent };
  if (q.id === 'address' && patient.address) return { ...patient.address };
  return undefined;
}

function Questionnaire({ visitId, mode, onExit }) {
  const visit = useDoc('visits', visitId);
  const patient = useDoc('patients', visit && visit.patientId);
  const settings = useDoc('settings', 'clinic') || {};
  const [lang, setLang] = useState((visit && visit.lang) || 'ja');
  const [answers, setAnswers] = useState(() => initialAnswers(visit, patient));
  const [idx, setIdx] = useState(() => (visit && visit.status === 'answering' && visit.progress ? (visit.progress.step || 0) : 0));
  const [err, setErr] = useState(null);
  const [backToReview, setBackToReview] = useState(false);
  const [callOpen, setCallOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const hadPhoto = useRef(null);
  if (hadPhoto.current === null && visit) hadPhoto.current = visit.hadPhoto != null ? !!visit.hadPhoto : !!Store.get('photos', visit.patientId);

  const tpl = templateOf(visit ? visit.templateId : 'new');
  const ctx = makeCtx(answers, patient, hadPhoto.current);
  const qs = visit ? visibleQs(tpl, ctx) : [];
  const i = Math.max(0, Math.min(idx, qs.length - 1));
  const q = qs[i] || null;

  useEffect(() => { Postal.prefetch(); }, []);
  useEffect(() => {
    if (!q || answers[q.id] !== undefined) return;
    const pre = prefillFor(q, visit, patient);
    if (pre !== undefined) setAnswers(a => ({ ...a, [q.id]: pre }));
  }, [q ? q.id : '']);
  useEffect(() => { window.scrollTo(0, 0); }, [i]);

  if (!visit) return html`<div className="center"><p>問診が見つかりません。受付にお声がけください。</p></div>`;

  const save = patch => Store.update('visits', visit.id, { ...patch, updatedAt: Date.now() });
  const startPatch = () => (visit.status === 'checked_in' ? { status: 'answering', startedAt: Date.now(), hadPhoto: !!hadPhoto.current } : {});

  function goNext() {
    const e = validate(q, answers[q.id], lang);
    if (e) { setErr(e); return; }
    setErr(null);
    let ni = i + 1;
    if (backToReview) { ni = qs.findIndex(x => x.type === 'review'); setBackToReview(false); }
    save({ answers, progress: { step: ni, total: qs.length }, lang, ...startPatch() });
    setIdx(ni);
  }
  function goBack() { setErr(null); setBackToReview(false); setIdx(Math.max(0, i - 1)); }
  function fillSample() {
    const merged = { ...answers, ...sampleAnswers(tpl.id, answers) };
    const qs2 = visibleQs(tpl, makeCtx(merged, patient, hadPhoto.current));
    const ri = qs2.findIndex(x => x.type === 'review');
    setAnswers(merged);
    save({ answers: merged, progress: { step: ri, total: qs2.length }, lang, ...startPatch() });
    setIdx(ri);
  }
  async function submit() {
    setBusy(true);
    const now = Date.now();
    const patch = { answers, status: 'answered', completedAt: now, progress: { step: qs.length, total: qs.length }, lang, hadPhoto: !!hadPhoto.current };
    if (!visit.startedAt) patch.startedAt = now;
    const addr = answers.address ? { ...answers.address, zip: U.digits(answers.address.zip) } : null;
    if (tpl.id !== 'new' && answers.profile_check === 'changed') {
      const c = answers.contact || {};
      patch.changeRequest = { tel: U.digits(c.tel), email: c.email || '', consent: !!c.consent, address: addr, at: now };
    }
    const ok = await save(patch);
    if (ok && tpl.id === 'new' && patient) {
      const c = answers.contact || {}, n = answers.name || {};
      await Store.update('patients', patient.id, {
        kana: U.kata(n.kana || '').trim() || patient.kana, kanji: (n.kanji || '').trim(), birth: answers.birth || '',
        sex: answers.sex || '', tel: U.digits(c.tel), email: c.email || '', consent: !!c.consent, address: addr,
        verified: false, provisional: false, updatedAt: now,
      });
    }
    setBusy(false);
  }

  const calling = !!(visit.patientCall && visit.patientCall.active);
  const header = html`<header className="q-top">
    <span className="q-clinic">${settings.name || ''}</span>
    <${Seg} label="言語 / Language" size="sm" value=${lang} onChange=${l => { setLang(l); save({ lang: l }); }}
      options=${[{ id: 'ja', label: '日本語' }, { id: 'en', label: 'English' }]} />
    ${calling
      ? html`<button type="button" className="callbtn on" onClick=${() => Ops.clearPatientCall(visit)}>${tr(UI.calling, lang)}（${tr(UI.cancelCall, lang)}）</button>`
      : html`<button type="button" className="callbtn" onClick=${() => setCallOpen(true)}>${tr(UI.callStaff, lang)}</button>`}
  </header>`;

  const sc = visit.staffCall;
  const overlay = sc && !sc.ack ? html`<div className="callout" role="alertdialog" aria-modal="true" aria-labelledby="callout-msg">
    <div>
      <p className="callout-name">${U.displayName(patient)}${lang === 'en' ? '' : ' さま'}</p>
      <p className="callout-msg" id="callout-msg">${lang === 'en' && sc.messageEn ? sc.messageEn : sc.message}</p>
      <button type="button" className="btn big inverse" onClick=${() => save({ staffCall: { ...sc, ack: true, ackAt: Date.now() } })}>${tr(UI.ok, lang)}</button>
    </div>
  </div>` : null;

  const callModal = callOpen ? html`<${Modal} title=${tr(UI.callTitle, lang)} onClose=${() => setCallOpen(false)}>
    <p className="muted">${tr(UI.callHelp, lang)}</p>
    <div className="stack">
      ${UI.callReasons.map(r => html`<button type="button" key=${r.id} className="btn big" onClick=${() => { save({ patientCall: { active: true, reason: r.id, at: Date.now() } }); setCallOpen(false); }}>${tr(r.label, lang)}</button>`)}
      <button type="button" className="btn ghost" onClick=${() => setCallOpen(false)}>${tr(UI.cancel, lang)}</button>
    </div>
  <//>` : null;

  const finished = ['answered', 'in_treatment', 'treated', 'done'].includes(visit.status);
  if (finished) {
    return html`<div className="q-shell">
      ${header}
      <main className="q-body done">
        <h1 className="q-title">${tr(UI.thanks, lang)}</h1>
        <p className="q-lead">${visit.status === 'answered' ? tr(mode === 'kiosk' ? UI.thanksKiosk : UI.thanksPhone, lang) : tr(UI.finished, lang)}</p>
        ${settings.waitInfo && lang === 'ja' ? html`<section className="wait-info"><h2>${tr(UI.waitTitle, lang)}</h2><p>${settings.waitInfo}</p></section>` : null}
        ${mode === 'phone' && onExit ? html`<button type="button" className="linkish" onClick=${onExit}>別の問診コードを入れる</button>` : null}
      </main>
      ${callModal}${overlay}
    </div>`;
  }

  if (!q) return null;
  const set = val => setAnswers(a => ({ ...a, [q.id]: typeof val === 'function' ? val(a[q.id]) : val }));
  const v = answers[q.id];
  let step = null;
  switch (q.type) {
    case 'info': step = html`<${GreetingStep} settings=${settings} lang=${lang} onSample=${fillSample} />`; break;
    case 'name': step = html`<${NameStep} value=${v} set=${set} lang=${lang} />`; break;
    case 'birth': step = html`<${BirthStep} value=${v} set=${set} lang=${lang} />`; break;
    case 'contact': step = html`<${ContactStep} value=${v} set=${set} lang=${lang} />`; break;
    case 'address': step = html`<${AddressStep} value=${v} set=${set} lang=${lang} />`; break;
    case 'single': step = html`<${OptionsStep} q=${q} value=${v} set=${set} lang=${lang} />`; break;
    case 'multi': step = html`<${OptionsStep} q=${q} value=${v} set=${set} lang=${lang} multi=${true} />`; break;
    case 'profile': step = html`<${ProfileStep} q=${q} value=${v} set=${set} lang=${lang} patient=${patient} />`; break;
    case 'teeth': step = html`<${TeethStep} value=${v} set=${set} lang=${lang} age=${ctx.age} />`; break;
    case 'text': step = html`<textarea className="big-text" rows="4" value=${v || ''} aria-labelledby="qt" onChange=${e => set(e.target.value)}></textarea>`; break;
    case 'photo': step = html`<${PhotoStep} value=${v} set=${set} lang=${lang} patientId=${visit.patientId} />`; break;
    case 'review': step = html`<${ReviewStep} qs=${qs} answers=${answers} lang=${lang} onEdit=${ix => { setErr(null); setBackToReview(true); setIdx(ix); }} />`; break;
    default: step = null;
  }
  const title = q.type === 'info'
    ? (lang === 'en' ? 'Welcome to ' + (settings.name || 'our clinic') : (settings.name || '') + 'へようこそ')
    : tr(q.title, lang);
  const pct = Math.round((i / Math.max(1, qs.length - 1)) * 100);

  return html`<div className="q-shell">
    ${header}
    <div className="q-progress" aria-label=${(i + 1) + ' / ' + qs.length}>
      <div className="prog"><i style=${{ width: pct + '%' }}></i></div>
      <span>${i + 1} / ${qs.length}</span>
    </div>
    <main className="q-body">
      <h1 className="q-title" id="qt">${title}</h1>
      ${q.help ? html`<p className="q-help">${tr(q.help, lang)}</p>` : null}
      <div key=${q.id} className="q-step">${step}</div>
      ${err ? html`<p className="err" role="alert">${tr(err, lang)}</p>` : null}
    </main>
    <footer className="q-foot"><div className="inner">
      ${i > 0 ? html`<button type="button" className="btn big" onClick=${goBack}>${tr(UI.back, lang)}</button>` : null}
      ${q.type === 'review'
        ? html`<button type="button" className="btn primary big next" disabled=${busy} onClick=${submit}>${tr(UI.submit, lang)}</button>`
        : html`<button type="button" className="btn primary big next" onClick=${goNext}>${backToReview ? tr(UI.toReview, lang) : tr(UI.next, lang)}</button>`}
    </div></footer>
    ${callModal}${overlay}
  </div>`;
}

function StaffHold({ onOpen, raised }) {

  const [holding, setHolding] = useState(false);
  const start = () => { setHolding(true); timer.current = setTimeout(() => { setHolding(false); onOpen(); }, 800); };
  const stop = () => { setHolding(false); clearTimeout(timer.current); };
  return html`<button type="button" className=${'staff-hold' + (raised ? ' raised' : '') + (holding ? ' holding' : '')}
    onPointerDown=${start} onPointerUp=${stop} onPointerLeave=${stop} onPointerCancel=${stop}
    onKeyDown=${e => { if (e.key === 'Enter') onOpen(); }} onContextMenu=${e => e.preventDefault()}>スタッフ（長押し）</button>`;
}

const SEX = { female: '女性', male: '男性', na: '回答なし' };
const REASON = { pain: '痛みが強い', howto: '操作が分からない', other: 'そのほか' };
const pctOf = v => { const p = v.progress || {}; return p.total ? Math.min(100, Math.round((p.step || 0) / p.total * 100)) : 0; };
function openClinic(v) { LS.setJSON('dtq-clinic-sel', { visitId: v.id, patientId: v.patientId }); go('clinic'); }

function searchPatients(list, q) {
  const s = U.kata(q || '').replace(/[\s\u3000]/g, '');
  const dg = U.digits(q);
  if (!s) return [];
  return list.filter(p => {
    const k = (p.kana || '').replace(/[\s\u3000]/g, ''), kj = (p.kanji || '').replace(/[\s\u3000]/g, '');
    if (dg && dg.length === s.length) return String(p.no).startsWith(dg) || U.digits(p.tel).includes(dg);
    return k.includes(s) || kj.includes(s);
  });
}

function RegisterPanel() {
  const patients = useColl('patients');
  const devices = useColl('devices');
  const visits = useColl('visits');
  const [tab, setTab] = useState('return');
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(null);
  const [kana, setKana] = useState('');
  const [tpl, setTpl] = useState('revisit');
  const [dest, setDest] = useState('');
  const [ticket, setTicket] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const free = devices.filter(d => !d.visitId).sort((a, b) => a.id.localeCompare(b.id));
  const destVal = dest && (dest === 'phone' || free.some(d => d.id === dest)) ? dest : (free[0] ? free[0].id : 'phone');
  const activeIds = new Set(visits.filter(v => v.status !== 'done').map(v => v.patientId));
  const results = searchPatients(patients, q);
  const choose = p => {
    setSel(p); setErr('');
    const last = Ops.latestVisit(p.id);
    const recent = (last && Date.now() - last.createdAt < 45 * 86400000) || (p.lastVisitAt && Date.now() - p.lastVisitAt < 45 * 86400000);
    setTpl(recent ? 'continue' : 'revisit');
  };
  async function register() {
    setErr('');
    let pid = sel && sel.id, k = sel && sel.kana, isNew = false;
    if (tab === 'new') {
      k = U.kata(kana).trim();
      if (!k) { setErr('フリガナを入れてください。'); return; }
    } else if (!sel) { setErr('患者さんを選んでください。'); return; }
    setBusy(true);
    if (tab === 'new') { pid = await Ops.createPatient(k); isNew = true; }
    const v = pid ? await Ops.createVisit({ patientId: pid, templateId: tab === 'new' ? 'new' : tpl, dest: destVal, kana: k, isNew }) : null;
    setBusy(false);
    if (!v) { setErr('受付できませんでした。'); return; }
    const d = destVal === 'phone' ? null : Store.get('devices', destVal);
    setTicket({ name: k, tpl: templateOf(v.templateId).name, code: v.code, phone: destVal === 'phone', dev: d ? d.label : '' });
    setSel(null); setQ(''); setKana('');
  }
  const destPicker = html`<label className="field"><span>問診を答えてもらう端末</span>
    <select value=${destVal} onChange=${e => setDest(e.target.value)}>
      ${free.map(d => html`<option key=${d.id} value=${d.id}>${d.label}（空き）</option>`)}
      <option value="phone">患者さんのスマホ（問診コード）</option>
    </select></label>`;
  return html`<section className="side-sec" aria-labelledby="reg-h">
    <h2 id="reg-h">受付する</h2>
    <${Seg} label="患者の種別" value=${tab} onChange=${t => { setTab(t); setErr(''); setTicket(null); }}
      options=${[{ id: 'return', label: '来院したことがある' }, { id: 'new', label: 'はじめて（新患）' }]} />
    ${tab === 'return' ? html`<div className="reg-body">
      <label className="field"><span>カナ氏名・患者番号・電話番号で探す</span>
        <input type="search" value=${q} placeholder="例）イトウ／10012" onChange=${e => { setQ(e.target.value); setSel(null); setTicket(null); }} /></label>
      ${q && !sel ? html`<ul className="results">
        ${results.slice(0, 5).map(p => html`<li key=${p.id}><button type="button" className="result" onClick=${() => choose(p)}>
          <${Avatar} patient=${p} size="sm" />
          <span><strong>${U.displayName(p)}</strong><span className="meta">${p.kana}　No.${p.no}${p.birth ? '　' + U.age(p.birth) + '歳' : ''}</span></span>
          ${activeIds.has(p.id) ? html`<span className="tag">受付済み</span>` : null}
        </button></li>`)}
        ${results.length === 0 ? html`<li className="meta">見つかりません。はじめての方は「はじめて（新患）」から受け付けてください。</li>` : null}
        ${results.length > 5 ? html`<li className="meta">6件以上あります。もう少し詳しく入れてください。</li>` : null}
      </ul>` : null}
      ${sel ? html`<div className="chosen">
        <div className="who"><${Avatar} patient=${sel} /><div><div className="name">${U.displayName(sel)}</div><div className="meta">No.${sel.no}　最終来院 ${sel.lastVisitAt ? U.date(sel.lastVisitAt) : '—'}</div></div></div>
        ${activeIds.has(sel.id) ? html`<p className="hint warn">本日はすでに受付済みです。</p>` : null}
        <label className="field"><span>問診の種類</span>
          <select value=${tpl} onChange=${e => setTpl(e.target.value)}>
            <option value="revisit">${TEMPLATES.revisit.name}</option>
            <option value="continue">${TEMPLATES.continue.name}</option>
          </select></label>
        ${destPicker}
        <button type="button" className="btn primary block" disabled=${busy || activeIds.has(sel.id)} onClick=${register}>受付して問診を送る</button>
        <button type="button" className="btn ghost small" onClick=${() => setSel(null)}>選び直す</button>
      </div>` : null}
    </div>` : html`<div className="reg-body">
      <label className="field"><span>フリガナ（カタカナ）</span>
        <input value=${kana} placeholder="例）サトウ ハナコ" onChange=${e => { setKana(e.target.value); setTicket(null); }} onBlur=${e => setKana(U.kata(e.target.value))} /></label>
      <p className="meta">ほかの情報は、患者さんが問診で入力します。</p>
      ${destPicker}
      <button type="button" className="btn primary block" disabled=${busy} onClick=${register}>受付して問診を送る</button>
    </div>`}
    ${err ? html`<p className="err" role="alert">${err}</p>` : null}
    ${ticket ? html`<div className="ticket" role="status">
      <p className="ticket-h">受付しました</p>
      <p className="ticket-name">${ticket.name} さま</p>
      <p className="meta">${ticket.tpl}</p>
      ${ticket.phone
        ? html`<div className="ticket-code"><span>問診コード</span><strong>${ticket.code}</strong></div>
          <p className="meta">患者さんのスマホで、このデモの「スマホで問診」を開き、このコードを入れてもらいます。</p>`
        : html`<div className="ticket-code"><span>お渡しする端末</span><strong className="dev">${ticket.dev}</strong></div>
          <p className="meta">その端末の画面が、自動で問診に切り替わります。</p>`}
      <button type="button" className="btn small" onClick=${() => setTicket(null)}>閉じる</button>
    </div>` : null}
  </section>`;
}

      ${p && v.isNew && !p.verified && v.completedAt ? html`<button type="button" className="linkish" onClick=${() => onModal({ type: 'verify', v })}>問診の基本情報を確認する</button>` : null}

      <div>${tpl.short}・${where}${v.target && v.target.type === 'phone' && !v.completedAt ? html`<span className="code">コード ${v.code}</span>` : null}</div>

const SECTION_LABEL = { visit: '今日の来院理由', health: '全身の状態・お薬', wish: '治療の希望', life: '通院・生活', profile: '基本情報' };

function AnswerSheet({ visit, patient }) {
  const { tpl, qs, answers } = answeredView(visit, patient);
  const items = qs.filter(q => q.type !== 'info' && q.type !== 'review');
  const groups = ['visit', 'health', 'wish', 'life', 'profile']
    .map(s => ({ s, items: items.filter(q => q.section === s) }))
    .filter(g => g.items.some(q => answers[q.id] !== undefined));
  const teethQ = items.find(q => q.type === 'teeth');
  const teeth = teethQ && answers[teethQ.id] ? (answers[teethQ.id].teeth || []) : [];
  const p = visit.progress || {};
  const statusLine = visit.status === 'checked_in' ? '患者さんが問診を始めるのを待っています'
    : visit.status === 'answering' ? '回答中（' + (p.step || 0) + '／' + (p.total || '—') + '）。入力されたそばから表示されます'
    : visit.completedAt ? '回答済み ' + U.time(visit.completedAt) : '';
  return html`<section className="pd-sec">
    <div className="sec-h"><h2>今回の問診</h2><p className="meta">${tpl.name}・${statusLine}${visit.lang === 'en' ? '・英語で回答' : ''}</p></div>
    ${isPriority(visit) ? html`<div className="banner call">「がまんできないほど痛い」と回答しています。</div>` : null}
    ${visit.changeRequest && !visit.changeRequest.appliedAt ? html`<div className="banner warn">連絡先・住所の変更申請があります（受付で登録を更新します）。</div>` : null}
    ${groups.map(g => html`<div key=${g.s} className="ans-group">
      <h3>${SECTION_LABEL[g.s]}</h3>
      <dl className="ans">
        ${g.items.map(q => {
          const t = fmtAnswer(q, answers[q.id], 'ja', true);
          return html`<div key=${q.id} className=${'ans-row' + (t ? '' : ' empty')}><dt>${q.staff || tr(q.title)}</dt><dd>${t || '—'}</dd></div>`;
        })}
      </dl>
      ${g.s === 'visit' && teeth.length ? html`<figure className="chart-mini">
        <${ToothChart} view="dentist" selected=${teeth} deciduous=${teeth.some(f => f >= 50)} compact=${true} />
        <figcaption className="meta">術者から見た向き（患者さんの右が左側）。患者さんは自分から見た左右で選んでいます。</figcaption>
      </figure>` : null}
    </div>`)}
    ${groups.length ? null : html`<p className="meta">まだ回答はありません。</p>`}
  </section>`;
}

function PostComposer({ patient, visit, settings }) {
  const [procs, setProcs] = useState([]);
  const [teeth, setTeeth] = useState([]);
  const [next, setNext] = useState('');
  const [body, setBody] = useState(null);
  const [publish, setPublish] = useState(true);
  const [msg, setMsg] = useState('');
  const text = body == null ? composePost(procs, teeth, next) : body;
  const title = procs.map(id => (PROCEDURES.find(p => p.id === id) || {}).label).join('・');
  const toggleProc = id => { setMsg(''); setProcs(p => (p.includes(id) ? p.filter(x => x !== id) : [...p, id])); };
  const toggleTooth = f => setTeeth(t => (t.includes(f) ? t.filter(x => x !== f) : [...t, f]));
  const canSave = procs.length > 0 || (body || '').trim().length > 0;
  const save = async () => {
    if (!canSave) return;
    const now = Date.now();
    const ok = await Store.set('posts', U.uid('t'), {
      patientId: patient.id, visitId: visit ? visit.id : '', date: now, createdAt: now,
      title: title || '治療の記録', body: text, teeth, procedures: procs, next, published: publish, author: settings.doctor || '',
    });
    if (ok) { setProcs([]); setTeeth([]); setNext(''); setBody(null); setMsg(publish ? 'マイページに公開しました' : '下書きとして保存しました'); }
  };

function MessageThread({ patient, as }) {
  const settings = useDoc('settings', 'clinic') || {};
  const msgs = useColl('messages').filter(m => m.patientId === patient.id && (as === 'staff' || !m.hidden)).sort((a, b) => a.at - b.at);
  const [text, setText] = useState('');
  const send = async () => {
    const t = text.trim();
    if (!t) return;
    const ok = await Store.set('messages', U.uid('m'), { patientId: patient.id, from: as === 'staff' ? 'staff' : 'patient', text: t, at: Date.now(), hidden: false });
    if (ok) setText('');
  };
  return html`<section className=${as === 'staff' ? 'pd-sec' : 'mp-sec'}>

      <p className="meta">${as === 'staff' ? 'マイページから届いたメッセージです。' : '診療についての判断は、来院されたときに行います。急ぎのときはお電話ください。'}</p></div>
    <div className="thread">
      ${msgs.length ? msgs.map(m => html`<div key=${m.id} className=${'msg ' + m.from + (m.hidden ? ' hidden-msg' : '')}>
